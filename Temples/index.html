<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CODEX · Guild Glory Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d17;--side:#0f1220;--panel:#141829;--panel2:#1a1f35;--line:#262c47;--tx:#e8eaf4;--mu:#8b92b0;--gold:#e8b64a;--cy:#4fd1e6;--vi:#9b7bff;--ok:#3ddc97;--er:#ff6b7d;--r:10px;--f1:'Rajdhani','Segoe UI',sans-serif;--f2:'Inter','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 var(--f2);background-image:radial-gradient(900px 500px at 85% -10%,rgba(155,123,255,.13),transparent 60%),radial-gradient(700px 400px at 0 110%,rgba(79,209,230,.08),transparent 60%)}
h1,h2,h3{font-family:var(--f1);font-weight:700;letter-spacing:.02em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
[hidden]{display:none!important}
#app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
aside{background:var(--side);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 18px}
.brand svg{width:40px;height:40px;flex:none}
.brand b{font:700 24px var(--f1);letter-spacing:.14em;display:block;line-height:1}
.brand small{color:var(--mu);font-size:12px}
nav{display:flex;flex-direction:column;gap:2px;flex:1}
nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;color:var(--mu);cursor:pointer;font-weight:500;border-left:3px solid transparent}
nav button:hover{background:var(--panel);color:var(--tx)}
nav button.on{background:var(--panel2);color:var(--gold);border-left-color:var(--gold)}
nav .sep{font-size:12px;color:var(--mu);padding:14px 12px 4px;opacity:.7}
.owner{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel)}
.owner small{color:var(--mu);display:block}
.owner b{font:700 18px var(--f1);color:var(--gold);letter-spacing:.12em}
main{padding:24px 28px 48px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h2{font-size:30px}
.top p{color:var(--mu)}
.me{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:99px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip b{font-family:var(--f1);font-size:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu);display:inline-block}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.er{background:var(--er)}.dot.wn{background:var(--gold)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card h3{font-size:19px;margin-bottom:12px}
.stat small{color:var(--mu);display:block;margin-bottom:2px}
.stat b{font:700 30px/1.1 var(--f1)}
.hero{border-color:rgba(232,182,74,.45);background:linear-gradient(135deg,rgba(232,182,74,.1),rgba(155,123,255,.07) 60%,var(--panel))}
.hero b{font-size:46px;color:var(--gold)}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-bottom:18px}
label{display:block;color:var(--mu);font-size:13px;margin-bottom:12px}
input,select{display:block;width:100%;margin-top:5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input:focus,select:focus{border-color:var(--cy);outline:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>label{flex:1;min-width:130px}
button.btn,.box button,form button{background:var(--gold);color:#1a1405;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
button.btn:hover,form button:hover{filter:brightness(1.08)}
button.ghost{background:transparent!important;color:var(--tx)!important;border:1px solid var(--line)!important}
button.sm{padding:4px 9px;font-size:12px;border-radius:6px}
button.dng{background:transparent!important;color:var(--er)!important;border:1px solid rgba(255,107,125,.4)!important}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mu);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(38,44,71,.6);white-space:nowrap}
tr:hover td{background:rgba(255,255,255,.015)}
td .row{gap:6px;flex-wrap:nowrap}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;background:var(--panel2);border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:rgba(61,220,151,.4)}.tag.er{color:var(--er);border-color:rgba(255,107,125,.4)}.tag.wn{color:var(--gold);border-color:rgba(232,182,74,.4)}.tag.vi{color:var(--vi)}
.log{font:12px/1.7 ui-monospace,Consolas,monospace;max-height:460px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.log i{font-style:normal;color:var(--mu)}
.log .success{color:var(--ok)}.log .error,.log .warning{color:var(--er)}.log .info{color:var(--cy)}
.empty{color:var(--mu);padding:22px;text-align:center}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.kv div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.kv small{color:var(--mu);display:block;font-size:12px}
.kv b{font-weight:600;word-break:break-all}
.note{color:var(--mu);font-size:12px;margin-top:-4px}
.code{font:600 15px ui-monospace,Consolas,monospace;color:var(--cy);letter-spacing:.06em;cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(5,6,12,.7);display:grid;place-items:center;z-index:50;padding:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(400px,100%)}
.box h3{font-size:22px;margin-bottom:14px}
#toast{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
#toast div{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--ok);padding:10px 14px;border-radius:8px;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast div.e{border-left-color:var(--er)}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px}
.login .brand{justify-content:center;flex-direction:column;text-align:center;padding-bottom:20px}
.login .brand svg{width:64px;height:64px}
.login .brand b{font-size:34px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:18px}
.tabs button{background:none;border:0;padding:8px;border-radius:7px;color:var(--mu);cursor:pointer;font-weight:600}
.tabs button.on{background:var(--panel2);color:var(--gold)}
.login form button{width:100%;padding:11px}
.foot{text-align:center;color:var(--mu);font-size:12px;margin-top:18px}
.foot b{color:var(--gold);letter-spacing:.12em}
@media(max-width:820px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.brand{padding:0}nav{flex-direction:row;overflow-x:auto;flex:1 1 100%}nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}nav button.on{border-bottom-color:var(--gold)}nav .sep,.owner{display:none}main{padding:18px 14px 40px}.hero b{font-size:38px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.top .me .chip b{color:var(--gold)}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">
      <svg viewBox="0 0 48 48"><path d="M24 3l18 10.5v21L24 45 6 34.5v-21z" fill="#141829" stroke="#e8b64a" stroke-width="2"/><path d="M29 18a8 8 0 100 12" fill="none" stroke="#4fd1e6" stroke-width="3" stroke-linecap="round"/><path d="M24 20l4 4-4 4" fill="none" stroke="#9b7bff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>CODEX</b><small>Guild Glory Panel</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="owner"><small>Owner</small><b>CODEX</b></div>
  </aside>
  <main>
    <div class="top"><div><h2 id="title"></h2><p id="sub"></p></div><div class="me" id="me"></div></div>
    <div id="view"></div>
  </main>
</div>
<div id="modal" hidden></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v||0).toLocaleString();
const dur=s=>{s=+s||0;const h=s/3600|0,m=s%3600/60|0;return h?h+'h '+m+'m':m+'m '+(s%60)+'s'};
const REG=['IND','BD','ME','BR','US','SAC','NA','SG','TH','VN','ID','PK','CIS','RU','TW'];
const store={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let VIEW='overview',TIMER=null,LAST=null;

async function api(path,body){
  const o={method:body?'POST':'GET',headers:{}};
  if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
  const r=await fetch(store.get('base','').replace(/\/$/,'')+path,o);
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok||(d&&(d.error||d.status==='error')))throw new Error((d&&d.error)||'Request failed ('+r.status+')');
  return d;
}
function toast(m,err){const t=document.createElement('div');if(err)t.className='e';t.textContent=m;$('#toast').append(t);setTimeout(()=>t.remove(),4200)}
function confirmBox(title,ok){
  const m=$('#modal');
  m.innerHTML=`<div class="box"><h3>${esc(title)}</h3><div class="row"><button class="ghost" data-act="close">Cancel</button><button data-act="okm">Confirm</button></div></div>`;
  m.hidden=false;m._ok=async()=>{await ok();m.hidden=true};m.querySelector('button.ghost').focus();
}
const status=s=>{const c=['ONLINE','IN_MATCH'].includes(s)?'ok':s==='OFFLINE'?'er':'wn';return `<span class="tag ${c}">${esc(s||'OFFLINE')}</span>`};
const stat=(l,v,c='')=>`<div class="card stat ${c}"><small>${l}</small><b>${v}</b></div>`;
const regionOpts=()=>REG.map(r=>`<option>${r}</option>`).join('');

const VIEWS={
overview:{t:'Overview',s:'Live bot performance at a glance.',
  html:()=>'<div id="ov"></div>',
  async load(st){
    const a=st.accounts||[],on=a.filter(x=>['ONLINE','IN_MATCH'].includes(x.status)).length;
    $('#ov').innerHTML=`<div class="grid">${stat('Total EXP gained',n(st.total_gained_exp),'hero')}${stat('EXP per hour',n(st.exp_per_hour))}${stat('Accounts online',on+' / '+n(st.total_accounts))}${stat('Active matches',n(st.total_active_matches))}${stat('Matches finished',n(st.total_matches))}${stat('Uptime',dur(st.uptime))}</div>
    <div class="two"><div class="card"><h3>Top accounts</h3>${a.slice(0,6).map(x=>`<div class="row" style="justify-content:space-between;padding:5px 0"><span>${esc(x.nickname||x.uid)} ${status(x.status)}</span><b>+${n(x.gained_exp)} EXP</b></div>`).join('')||'<div class="empty">No bot accounts yet. Add one in Bot accounts.</div>'}</div>
    <div class="card"><h3>Latest activity</h3><div class="log" style="max-height:220px">${(st.logs||[]).slice(-8).map(l=>`<div class="${esc(l.level)}"><i>${esc(l.time)}</i> ${esc(l.message)}</div>`).join('')||'<div class="empty">No log entries.</div>'}</div></div></div>`;
  }},
join:{t:'Join guild',s:'Send every bot account into a guild.',
  html:()=>`<div class="card" style="max-width:520px"><h3>Join a guild</h3><form data-form="join"><label>Guild (clan) ID<input name="clan_id" inputmode="numeric" pattern="[0-9]+" required></label><button>Send join requests</button></form><p class="note" style="margin-top:12px">Every account in your token cache sends a request in its own region.</p></div>`},
accounts:{t:'Bot accounts',s:'Add, pause, refresh and remove the accounts that earn glory.',
  html:()=>`<div class="card" style="margin-bottom:14px"><h3>Add account</h3><form data-form="addacc"><div class="row"><label>Guest UID<input name="uid"></label><label>Password<input name="password"></label><label>or Token<input name="token"></label></div><div class="row"><button>Add account</button><button type="button" class="ghost" data-act="pauseall">Pause / resume all</button></div></form></div><div class="card"><div class="tw" id="acc"></div></div>`,
  async load(st){const a=st.accounts||[];
    $('#acc').innerHTML=a.length?`<table><tr><th>Account</th><th>Region</th><th>Level</th><th>EXP</th><th>Gained</th><th>Matches</th><th>Uptime</th><th>Status</th><th></th></tr>${a.map(x=>`<tr><td><b>${esc(x.nickname||'—')}</b><br><span class="note">${esc(x.uid)}</span></td><td>${esc(x.region)}</td><td>${n(x.level)}</td><td>${n(x.current_exp)}</td><td>+${n(x.gained_exp)}</td><td>${n(x.matches ?? x.matches_played ?? 0)} (${n(x.active_matches ?? 0)} live)</td><td>${dur(x.uptime_seconds)}</td><td>${x.is_paused?'<span class="tag wn">PAUSED</span>':status(x.status)}</td><td><div class="row"><button class="btn sm ghost" data-act="acc" data-arg="pause|${esc(x.uid)}">${x.is_paused?'Resume':'Pause'}</button><button class="btn sm ghost" data-act="acc" data-arg="refresh|${esc(x.uid)}">Refresh</button><button class="btn sm ghost" data-act="acc" data-arg="restart|${esc(x.uid)}">Restart</button><button class="btn sm dng" data-act="delacc" data-arg="${esc(x.uid)}">Delete</button></div></td></tr>`).join('')}</table>`:'<div class="empty">No accounts yet. Add one above.</div>'}},
logs:{t:'Live logs',s:'What the bot is doing right now.',
  html:()=>`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">Activity</h3><button class="btn sm ghost" data-act="clearlogs">Clear logs</button></div><div class="log" id="lg"></div></div>`,
  async load(st){const el=$('#lg'),bottom=el.scrollTop+el.clientHeight>=el.scrollHeight-30;
    el.innerHTML=(st.logs||[]).map(l=>`<div class="${esc(l.level)}"><i>${esc(l.time)}</i> ${esc(l.message)}</div>`).join('')||'<div class="empty">No log entries.</div>';
    if(bottom)el.scrollTop=el.scrollHeight}},
guild:{t:'Guild info',s:'Look up a guild and see its XP gained since your first check.',
  html:()=>`<div class="card" style="margin-bottom:14px"><form data-form="guild"><div class="row"><label>Guild ID<input name="guild_id" required></label><label>Region<select name="region">${regionOpts()}</select></label><div style="padding-bottom:12px"><button>Look up</button></div></div></form><p class="note">Uses the guild API key saved in Settings.</p></div><div id="gi"></div>`},
settings:{t:'Settings',s:'Connection, guild key and refresh rate.',
  html:()=>`<div class="card" style="max-width:520px"><form data-form="settings"><label>Server URL (leave empty if this page is served by the bot)<input name="base" value="${esc(store.get('base',''))}" placeholder="https://your-app.up.railway.app"></label><label>Guild API key<input name="key" type="password" value="${esc(store.get('key',''))}"></label><label>Auto refresh (seconds, 0 = off)<input name="every" type="number" min="0" value="${esc(store.get('every','5'))}"></label><button>Save settings</button></form></div>`}
};

async function poll(){
  try{LAST=await api('/api/stats');const v=VIEWS[VIEW];if(v.load)await v.load(LAST);
    $('#me').innerHTML=`<span class="chip"><span class="dot ok"></span>Server online</span><span class="chip">Accounts <b>${n(LAST.total_accounts)}</b></span><span class="chip">EXP/hour <b>${n(LAST.exp_per_hour)}</b></span>`}
  catch(e){$('#me').innerHTML='<span class="chip"><span class="dot er"></span>Server unreachable</span>'}
}
function go(k){
  if(!VIEWS[k])k='overview';
  VIEW=k;const v=VIEWS[k];
  $('#title').textContent=v.t;$('#sub').textContent=v.s;
  $('#nav').innerHTML=Object.entries(VIEWS).map(([id,x])=>`<button data-act="go" data-arg="${id}" class="${id===k?'on':''}">${x.t}</button>`).join('');
  $('#view').innerHTML=v.html();
  clearInterval(TIMER);
  if(v.load){if(LAST)v.load(LAST);poll();const s=+store.get('every','5');if(s>0)TIMER=setInterval(()=>{if(document.visibilityState==='visible')poll()},s*1000)}
  else poll();
}
const ACT={
  go:k=>go(k),
  close:()=>$('#modal').hidden=true,
  okm:()=>$('#modal')._ok().catch(e=>toast(e.message,1)),
  pauseall:async()=>{const r=await api('/api/account/pause_all',{});toast(r.all_paused?'All accounts paused':'All accounts resumed');poll()},
  acc:async a=>{const[x,uid]=a.split('|');await api('/api/account/'+x,{uid});toast('Done: '+x);poll()},
  delacc:uid=>confirmBox('Delete account '+uid+'?',async()=>{await api('/api/account/delete',{uid});toast('Account deleted');poll()}),
  clearlogs:async()=>{await api('/api/logs/clear',{});poll()}
};
const FORM={
  join:async(d,f)=>{const r=await api('/api/clanjoin',d);toast(r.message || (r.attempted!=null ? `Sent for ${r.attempted} account(s)` : 'Requests sent'));f.reset()},
  addacc:async(d,f)=>{const body=d.token.trim()?{token:d.token.trim()}:{uid:d.uid.trim(),password:d.password.trim()};await api('/api/account/add',body);toast('Account added');f.reset();poll()},
  guild:async d=>{
    const key=store.get('key','');if(!key)throw new Error('Add the guild API key in Settings first');
    $('#gi').innerHTML='<div class="empty">Looking up…</div>';
    try{const r=await api('/api/guildinfo?guild_id='+encodeURIComponent(d.guild_id)+'&region='+d.region+'&key='+encodeURIComponent(key));
      const c=r.api_response.clan_basic_info;
      $('#gi').innerHTML=`<div class="card"><h3>Guild ${esc(r.queried_clan_id)} · ${esc(r.requested_region)}</h3><div class="kv">${Object.entries(c).filter(([k,v])=>typeof v!=='object').map(([k,v])=>`<div><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div></div>`}
    catch(e){$('#gi').innerHTML='';throw e}},
  settings:async d=>{store.set('base',d.base.trim());store.set('key',d.key);store.set('every',String(Math.max(0,+d.every||0)));toast('Settings saved');go('settings')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;Promise.resolve(ACT[b.dataset.act]&&ACT[b.dataset.act](b.dataset.arg,b)).catch(x=>toast(x.message,1))});
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();try{await FORM[f.dataset.form](Object.fromEntries(new FormData(f)),f)}catch(x){toast(x.message,1)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').hidden=true});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.hidden=true});
go('overview');
</script>
</body>
  </html>
